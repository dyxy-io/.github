name: Feature request
description: Suggest a new feature or an improvement.
labels: ["enhancement"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Swap
        - Perps
        - Stocks
        - Trading bots
        - Pools
        - Staking
        - Lend
        - Referrals
        - Portfolio
        - Docs
        - New product
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you use today instead?
